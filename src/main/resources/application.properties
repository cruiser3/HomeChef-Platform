jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.application.name=food-delivery-backend

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/homechef_platform?serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:homechef_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=./uploads

app.ai.enabled=true
app.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=qwen2.5:7b
app.ai.ollama.timeout-ms=120000

# 「小铲」用户自配 API Key 的 AES 加密密钥（经 SHA-256 派生 256-bit 密钥；生产环境务必覆盖为强随机值）
app.ai.config.encryption-key=${AI_CONFIG_ENCRYPTION_KEY:local-dev-key-change-me}

# HowToCook 系统菜谱批量导入（默认关闭；开启后每次启动幂等导入，已存在则跳过）
app.system-dish.import.enabled=true
app.system-dish.import.howtocook-path=./HowToCook