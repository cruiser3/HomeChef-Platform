jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.application.name=food-delivery-backend

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/homechef_platform?serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:homechef_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=./uploads

app.ai.enabled=true
app.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=qwen2.5:7b
app.ai.ollama.timeout-ms=120000